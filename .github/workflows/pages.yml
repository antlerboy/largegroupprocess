name: Publish large-group processes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand a staged site package
        if: hashFiles('site-rebuild.tar.xz') != ''
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf site-rebuild.tar.xz -C .
          rm site-rebuild.tar.xz
          git config user.name 'antlerboy site publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A README.md index.html style.css app.js manifest.json .nojekyll site-rebuild.tar.xz
          if ! git diff --cached --quiet; then
            git commit -m 'Expose the large-group-processes site source'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify search and accessible filtering
        env:
          NODE_PATH: /tmp/collection-browser/node_modules
        run: |
          npm install --prefix /tmp/collection-browser --no-save playwright@1.55.0
          /tmp/collection-browser/node_modules/.bin/playwright install --with-deps chromium
          node .github/tests/search.cjs

      - name: Prepare the static site
        shell: bash
        run: |
          rm -rf _site
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='site-rebuild.tar.xz' ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
